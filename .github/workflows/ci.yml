name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codesync
          POSTGRES_PASSWORD: codesync
          POSTGRES_DB: codesync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codesync -d codesync"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://codesync:codesync@localhost:5432/codesync
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:deploy
      - run: pnpm test
      - run: pnpm --filter @codesync/web build

  # Spec §4.3 security suite against real containers: network, fork bomb, memory bomb,
  # infinite loop, writes to /, host files. Fails (rather than skips) if Docker is missing.
  sandbox:
    runs-on: ubuntu-latest
    needs: check
    env:
      REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker pull -q node:24-alpine && docker pull -q python:3.12-alpine
      - run: pnpm --filter @codesync/runner test:docker --reporter=verbose

  # The images that get deployed: they must build, migrate, save rooms when stopped, and (runner)
  # enforce the sandbox limits with their own nested Docker daemon.
  images:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codesync
          POSTGRES_PASSWORD: codesync
          POSTGRES_DB: codesync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codesync -d codesync"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://codesync:codesync@localhost:5432/codesync
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: docker build -q -f apps/collab/Dockerfile -t codesync-collab:ci .
      - run: docker build -q -f apps/runner/Dockerfile.fly -t codesync-runner:ci .
      - name: Migrate with the image's release command
        run: >-
          docker run --rm --network=host -e DATABASE_URL codesync-collab:ci
          pnpm --dir /repo --filter @codesync/db migrate:deploy
      - name: Stopping the container saves open rooms
        run: pnpm --filter @codesync/collab test:image
        env:
          COLLAB_IMAGE: codesync-collab:ci
      - name: The runner VM image verifies its own sandbox
        run: |
          docker run -d --name runner --privileged -p 127.0.0.1:14000:4000 -v runner-data:/data \
            -e RUNNER_HMAC_KEY="$(openssl rand -base64 32)" codesync-runner:ci
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:14000/health | grep -q '"ready":true'; then exit 0; fi
            sleep 2
          done
          docker logs runner
          exit 1

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codesync
          POSTGRES_PASSWORD: codesync
          POSTGRES_DB: codesync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codesync -d codesync"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://codesync:codesync@localhost:5432/codesync
      NEXT_PUBLIC_COLLAB_URL: ws://localhost:1234
      AUTH_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - name: Generate throwaway secrets for this run
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "WS_TOKEN_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "COLLAB_INTERNAL_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "RUNNER_HMAC_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Pre-pull sandbox images
        run: docker pull -q node:24-alpine && docker pull -q python:3.12-alpine
      - run: pnpm --filter @codesync/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
